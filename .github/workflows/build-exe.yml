name: Build and Release Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

# Change only this line when starting a new release series.
# Example: "1.0" produces tags such as v1.0.27, v1.0.28, etc.
env:
  RELEASE_SERIES: "1.2"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller
          pip install playsound --only-binary playsound

          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Stamp application version
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_SERIES }}.${{ github.run_number }}"
          $content = Get-Content "app_version.py" -Raw
          $content = $content -replace 'APP_VERSION = "[^"]+"', "APP_VERSION = `"$version`""
          Set-Content -Path "app_version.py" -Value $content -Encoding utf8

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller uwh.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist\UnderwaterHockeyScoringDesk\UnderwaterHockeyScoringDesk.exe"

          if (-not (Test-Path $exe)) {
            throw "Expected EXE was not found: $exe"
          }

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Compress-Archive `
            -Path "dist\UnderwaterHockeyScoringDesk\*" `
            -DestinationPath "release\UnderwaterHockeyScoringDesk-v${{ env.RELEASE_SERIES }}.${{ github.run_number }}-Windows.zip" `
            -Force

      # Upload the uncompressed PyInstaller folder as the Actions artifact.
      # GitHub automatically packages an Actions artifact as a ZIP download,
      # so uploading the folder avoids a ZIP file inside another ZIP file.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: UWH-Scoring-Desk-v${{ env.RELEASE_SERIES }}.${{ github.run_number }}-Windows
          path: dist/UnderwaterHockeyScoringDesk/
          if-no-files-found: error

      # Keep the existing uncompressed Actions artifact for testers.
      # Also retain the release ZIP so the publish job can run separately.
      - name: Upload release ZIP for publication
        uses: actions/upload-artifact@v7.0.1
        with:
          name: UWH-Release-ZIP-${{ github.run_number }}
          path: release/UnderwaterHockeyScoringDesk-v${{ env.RELEASE_SERIES }}.${{ github.run_number }}-Windows.zip
          if-no-files-found: error

  # Windows builds can overlap; only publication is serialized. GitHub does
  # not guarantee concurrency queue ordering, so each job independently
  # checks main SHA and all existing numeric release versions before posting.
  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: uwh-windows-release-publish
      queue: max
      cancel-in-progress: false

    steps:
      - name: Checkout release guard
        uses: actions/checkout@v6

      - name: Skip outdated or already-published releases
        id: freshness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release_gate.py

      - name: Download release ZIP
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: UWH-Release-ZIP-${{ github.run_number }}
          path: release

      # Recheck after download: main can advance while artifacts transfer.
      - name: Recheck immediately before publishing
        if: steps.freshness.outputs.publish == 'true'
        id: final
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/release_gate.py

      - name: Create GitHub Release
        if: steps.final.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: v${{ env.RELEASE_SERIES }}.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: UWH Scoring Desk v${{ env.RELEASE_SERIES }}.${{ github.run_number }}
          body: |
            Underwater Hockey Scoring Desk Kit — Windows release.

            Build number: ${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: release/UnderwaterHockeyScoringDesk-v${{ env.RELEASE_SERIES }}.${{ github.run_number }}-Windows.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
