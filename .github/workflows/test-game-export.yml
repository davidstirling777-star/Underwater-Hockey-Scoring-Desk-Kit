name: Game export regression tests

on:
  pull_request:
    paths:
      - "uwh.py"
      - "game_flow.py"
      - "game_engine.py"
      - "tests/**"
      - ".github/workflows/test-game-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-export-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run headless regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
